name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [sideload]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "No .app produced" >&2
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry 3105-unsigned.ipa Payload/
          ls -la 3105-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: 3105-unsigned.ipa